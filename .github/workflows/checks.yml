name: checks

on:
  push:
    branches: ['main']
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
      - run: biome ci .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Astro 7 verlangt Node >= 22.23.4; ohne check-latest nimmt setup-node das ältere Node aus dem Runner-Image.
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm install
      - run: npm run test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Astro 7 verlangt Node >= 22.23.4; ohne check-latest nimmt setup-node das ältere Node aus dem Runner-Image.
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Astro 7 verlangt Node >= 22.23.4; ohne check-latest nimmt setup-node das ältere Node aus dem Runner-Image.
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm install
      - run: npm run build
