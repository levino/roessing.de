# Cloudflare Worker Konfiguration für roessing.de
# Deployment als Cloudflare Worker mit Static Assets (KEIN Cloudflare Pages!)

name = "roessing-de"

# Aktuelles Kompatibilitätsdatum
compatibility_date = "2025-12-16"

# Assets-Konfiguration für statische Seiten
[assets]
directory = "./dist"

# Preview-Deployments werden über Cloudflare Workers Git-Integration gesteuert
# Build-Umgebungsvariable WORKERS_CI_BRANCH wird für die Site-URL verwendet
